services:
  app:
    image: ghcr.io/ozkannceylan/belegpilot:latest
    container_name: belegpilot-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - edge

  db:
    image: postgres:16-alpine
    container_name: belegpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: belegpilot
      POSTGRES_USER: belegpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /data/belegpilot/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belegpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

networks:
  internal:
    driver: bridge
  edge:
    name: belegpilot-edge
    external: true
